# ═══════════════════════════════════════════════════════════════════════════════
# Android Preview Build
# ═══════════════════════════════════════════════════════════════════════════════
#
# Builds an installable Android APK and publishes it to GitHub Releases as a
# PRERELEASE, so testers can sideload the current state of the game without an
# Expo account, an EAS subscription, or any repository secrets.
#
# Why a local Gradle build rather than `eas build`: EAS runs on Expo's
# infrastructure and needs an EXPO_TOKEN plus a paid queue. This project's
# native folders are generated (`/android` and `/ios` are gitignored), so CI
# can prebuild them from app.json and hand the result to Gradle on the runner.
#
# SIGNING: Expo's Android template points the `release` build type at the debug
# keystore, so `assembleRelease` produces a fully installable APK with no
# secrets configured. That is exactly right for previews, but it means these
# builds are NOT Play Store uploadable -- a Play release needs a real upload
# key, which is deliberately out of scope here.
#
# Triggers:
#   * manually, via the Actions tab (Run workflow)
#   * automatically, on any tag matching v* or preview-*
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Android Preview Build

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional note shown in the release body"
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "preview-*"

# Needed to create the release and upload the APK to it.
permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        # `npm install` rather than `npm ci`: the repo carries both a
        # package-lock.json and a bun.lock, so the npm lock can lag behind
        # package.json and `ci` would fail on the drift rather than build.
        run: npm install --no-audit --no-fund

      - name: Resolve build identity
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="preview-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=Terminalator-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      - name: Generate native Android project
        # /android is gitignored, so it is regenerated from app.json each run.
        # --no-install stops prebuild from redoing the dependency install above.
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Raise Gradle heap
        # The default heap is tuned for laptops; the runner has far more to give
        # and a React Native release build is happy to use it.
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::No APK produced by assembleRelease"
            exit 1
          fi
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/${{ steps.meta.outputs.apk }}"
          ls -lh dist-apk
          echo "path=dist-apk/${{ steps.meta.outputs.apk }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          Preview build of Terminalator for Android.

          **Install:** download the `.apk` below and open it on the device.
          Android will ask you to allow installs from this source the first time.

          **Signing:** preview builds are signed with Expo's debug keystore, so
          they install fine for testing but cannot be uploaded to the Play
          Store, and they will not upgrade in place over a differently-signed
          build.
          NOTES
          echo "" >> release-notes.md
          echo "Commit: ${{ github.sha }}" >> release-notes.md
          if [ -n "${{ inputs.notes }}" ]; then
            echo "" >> release-notes.md
            echo "${{ inputs.notes }}" >> release-notes.md
          fi

      - name: Publish preview release
        # gh is preinstalled on the runner, so cutting the release needs no
        # third-party action. Re-running the same tag updates it in place
        # rather than failing on an existing release.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --prerelease \
              --title "Terminalator preview $TAG" \
              --notes-file release-notes.md
          fi
          echo "Published $TAG"
