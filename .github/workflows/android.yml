# Android build: an installable APK for every commit pushed to any branch.
#
# Every push runs the test suite and builds a release APK with Gradle on the
# runner (no Expo account, EAS queue or repository secrets needed). The APK is
# attached to the run as an artifact. Pushes to main/master and v*/preview-*
# tags also publish it as a GitHub prerelease, so it can be downloaded on a
# phone without signing in to Actions.
#
# /android is gitignored: it is regenerated from app.json by `expo prebuild`.
# Signing: Expo's template signs `release` with the debug keystore, so the APK
# installs for testing but cannot be uploaded to the Play Store.

name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*", "preview-*"]
  workflow_dispatch:

permissions:
  contents: write

# One build per commit; a newer push does not cancel an older commit's build.
concurrency:
  group: android-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile is committed (package-lock.json is gitignored), so `npm ci` cannot run.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships an Android SDK (ANDROID_HOME) with licenses accepted;
      # Gradle downloads any missing platform/build-tools itself. (setup-android@v3
      # fails there: it installs the long-removed 'tools' package by default.)
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve build name
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="preview-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=Terminalator-$TAG.apk" >> "$GITHUB_OUTPUT"

      - name: Generate native Android project
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Raise Gradle heap
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::assembleRelease produced no APK"
            exit 1
          fi
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/${{ steps.meta.outputs.apk }}"
          ls -lh dist-apk
          echo "path=dist-apk/${{ steps.meta.outputs.apk }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        if: github.ref_type == 'tag' || github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          printf 'Android build of Terminalator.\n\nInstall: download the .apk and open it on the device (allow installs from this source when asked).\nSigned with the debug keystore: for testing only, not Play Store uploadable.\n\nCommit: %s\n' "$GITHUB_SHA" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --prerelease --target "$GITHUB_SHA" \
              --title "Terminalator $TAG" --notes-file notes.md
          fi
